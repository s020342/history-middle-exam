# ============================================================================
# 历史中考训练小程序 - 教师原创题目录入模板
# ============================================================================
# 使用方法：
#   1. 将本文件复制一份，重命名为：teacher-您的姓名.yaml（如 teacher-张老师.yaml）
#   2. 修改下方两条示例题目的内容（一条选择题、一条判断题的示范）
#   3. 继续复制题目条目，录入更多题目
#   4. 填写完整后交回教研负责人
# ----------------------------------------------------------------------------
# 填写速览：
#   【必填】externalId / type / stem / options / answer / knowledgeIds
#           difficulty / author
#   【选填】analysis（强烈建议填写，审核必看）
#   【无需填写，系统自动补】sourceType（默认原创）/ license（默认 CC-BY-SA-4.0）
#           subject（默认 HISTORY）/ primaryKnowledgeId（默认取 knowledgeIds 第一个）
# ----------------------------------------------------------------------------
# 格式红线（不满足会被工具自动拦截）：
#   * 选择题必须有 2~4 个选项，答案必须是 A/B/C/D 之一且在选项中
#   * 判断题不填 options（保持 null），答案只能是 T（对）或 F（错）
#   * knowledgeIds 必须从《教师填写说明》的考点编码表中选择，至少 1 个
#   * 题干、选项内容不能为空
# ----------------------------------------------------------------------------

# ------------------------------- 示例 1：选择题 -----------------------------
- externalId: T-001            # 题目编号，按 T-001、T-002 依次递增
  type: SINGLE_CHOICE          # 题型：选择题填 SINGLE_CHOICE
  stem: （示例）秦始皇统一六国的年份是？   # 题干，请替换为您的题目
  options:                     # 选项，2~4 个，key 依次 A/B/C/D
    - {key: A, content: 公元前221年}
    - {key: B, content: 公元前206年}
    - {key: C, content: 公元220年}
    - {key: D, content: 公元618年}
  answer: A                    # 正确答案，必须是上面某个选项的 key
  analysis: （示例）公元前221年秦灭六国，建立第一个统一的多民族的中央集权国家。  # 解析，建议写明史实依据
  knowledgeIds: [K-CHN-ANC-QIN-HAN]   # 考点编码，见填写说明中的考点编码表
  difficulty: 2                # 难度：1 易 / 2 中 / 3 难
  author: 张老师               # 您的姓名，用于署名与来源追溯

# ------------------------------- 示例 2：判断题 -----------------------------
- externalId: T-002
  type: TRUE_FALSE             # 题型：判断题填 TRUE_FALSE
  stem: （示例）丝绸之路是张骞出使西域之后开通的中外交通要道。
  options: null                # 判断题必须保持 null，不要填选项
  answer: T                    # T 表示正确，F 表示错误
  analysis: （示例）张骞两次出使西域为丝路开辟奠定基础，促进了东西方交流。
  knowledgeIds: [K-CHN-ANC-QIN-HAN]
  difficulty: 1
  author: 张老师

# ============================================================================
# 从这里开始继续添加您的题目（复制上面任一示例的格式）
# ============================================================================
