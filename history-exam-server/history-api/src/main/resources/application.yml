server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    max-threads: 200
    accept-count: 100

spring:
  application:
    name: history-exam-server
  profiles:
    active: dev
  # Jackson 配置：Long 序列化为字符串避免 JS 精度丢失
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    generator:
      write-numbers-as-strings: false
  # 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:history_exam}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # Redis（Redisson 默认读取此节点）
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.history.exam.**.entity
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

# 业务配置：JWT 密钥、微信小程序、微信支付、阿里云短信（全部走环境变量）
history:
  jwt:
    secret: ${JWT_SECRET:history-exam-jwt-secret-key-change-me-in-prod}
  wx:
    miniapp:
      appid: ${WX_APPID:}
      secret: ${WX_SECRET:}
    pay:
      mch-id: ${WX_PAY_MCH_ID:}
      api-v3-key: ${WX_PAY_API_V3_KEY:}
      cert-serial-no: ${WX_PAY_CERT_SERIAL:}
      private-key-path: ${WX_PAY_PRIVATE_KEY_PATH:}
      notify-url: ${WX_PAY_NOTIFY_URL:https://your-domain/pay/notify}
  aliyun:
    sms:
      access-key-id: ${ALIYUN_SMS_AK:}
      access-key-secret: ${ALIYUN_SMS_SK:}
      sign-name: ${ALIYUN_SMS_SIGN:}
      template-code: ${ALIYUN_SMS_TEMPLATE:}

# 接口文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 日志
logging:
  level:
    root: INFO
    com.history.exam: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{40} - %msg%n"
